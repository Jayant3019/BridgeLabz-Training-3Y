<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow – Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q7_task_tracker.css">
</head>
<body class="bg-light">
  <header class="bg-dark text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h3 mb-0">TaskFlow</h1>
      <!-- badge counter: total pending tasks -->
      <span class="fs-6">Pending tasks <span class="badge rounded-pill bg-danger">5</span></span>
    </div>
  </header>

  <main class="container my-4">
    <h2 class="h4 mb-3">This week's tasks</h2>
    <!-- list-group = vertical list; badges coloured by priority -->
    <ul class="list-group shadow-sm mb-4">
      <li class="list-group-item d-flex justify-content-between align-items-center">Fix login page bug <span class="badge bg-danger">High</span></li>
      <li class="list-group-item d-flex justify-content-between align-items-center">Prepare sprint demo <span class="badge bg-danger">High</span></li>
      <li class="list-group-item d-flex justify-content-between align-items-center">Update API documentation <span class="badge bg-warning text-dark">Medium</span></li>
      <li class="list-group-item d-flex justify-content-between align-items-center">Review pull requests <span class="badge bg-warning text-dark">Medium</span></li>
      <li class="list-group-item d-flex justify-content-between align-items-center">Clean up old branches <span class="badge bg-success">Low</span></li>
    </ul>

    <!-- button with an embedded badge -->
    <button type="button" class="btn btn-success">
      Completed <span class="badge text-bg-light">12</span>
    </button>
  </main>

  <footer class="text-center text-muted py-3"><small>&copy; 2026 TaskFlow</small></footer>
</body>
</html>
