<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="q7.css"></head>
<body><header class="bg-dark text-white py-4"><div class="container d-flex justify-content-between align-items-center"><h1 class="h3">Task Tracker</h1><span class="badge bg-danger fs-6">5 Pending</span></div></header>
<main class="container py-5"><section class="card shadow-sm"><div class="card-body"><h2 class="h4">Today's Tasks</h2><ul class="list-group mt-3">
<li class="list-group-item d-flex justify-content-between">Finish Bootstrap assignment <span class="badge bg-danger">High</span></li>
<li class="list-group-item d-flex justify-content-between">Review Java notes <span class="badge bg-warning text-dark">Medium</span></li>
<li class="list-group-item d-flex justify-content-between">Practice CSS Grid <span class="badge bg-success">Low</span></li>
<li class="list-group-item d-flex justify-content-between">Update portfolio <span class="badge bg-warning text-dark">Medium</span></li>
<li class="list-group-item d-flex justify-content-between">Read project documentation <span class="badge bg-success">Low</span></li>
</ul><button class="btn btn-primary mt-4">Completed <span class="badge bg-light text-primary">3</span></button></div></section></main>
<footer class="text-center py-3 bg-light">Stay organized and keep learning.</footer></body></html>
