<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="q3_image_showcase.css">
</head>
<body>
  <header>
    <h1>Landscape Gallery</h1>
    <p>Six scenes from around the world</p>
  </header>

  <main>
    <section class="gallery">
      <figure class="card">
        <div class="frame"><img src="images/sunset.svg" alt="Golden Sunset"></div>
        <figcaption>Golden Sunset</figcaption>
      </figure>
      <figure class="card">
        <div class="frame"><img src="images/ocean.svg" alt="Calm Ocean Waves"></div>
        <figcaption>Calm Ocean Waves</figcaption>
      </figure>
      <figure class="card">
        <div class="frame"><img src="images/forest.svg" alt="Emerald Forest"></div>
        <figcaption>Emerald Forest</figcaption>
      </figure>
      <figure class="card">
        <div class="frame"><img src="images/lavender.svg" alt="Lavender Fields"></div>
        <figcaption>Lavender Fields</figcaption>
      </figure>
      <figure class="card">
        <div class="frame"><img src="images/desert.svg" alt="Desert Dunes"></div>
        <figcaption>Desert Dunes</figcaption>
      </figure>
      <figure class="card">
        <div class="frame"><img src="images/night.svg" alt="Starry Night Sky"></div>
        <figcaption>Starry Night Sky</figcaption>
      </figure>
    </section>
  </main>

  <footer><p>&copy; 2026 CSS Practice</p></footer>
</body>
</html>
