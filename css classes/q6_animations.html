<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Animations</title>
  <link rel="stylesheet" href="q6_animations.css">
</head>
<body>
  <header>
    <h1>CSS Animation Showcase</h1>
  </header>

  <main>
    <section class="stage">
      <div class="item">
        <div class="slider"><div class="box"></div></div>
        <p>Moving box</p>
      </div>

      <div class="item">
        <div class="ball-area"><div class="ball"></div></div>
        <p>Bouncing ball</p>
      </div>

      <div class="item">
        <h2 class="color-text">Color Magic</h2>
        <p>Color-changing text</p>
      </div>

      <div class="item">
        <div class="pulse"></div>
        <p>Pulsing circle</p>
      </div>
    </section>
  </main>

  <footer><p>&copy; 2026 CSS Practice</p></footer>
</body>
</html>
