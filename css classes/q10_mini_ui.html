<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini UI – Event Signup</title>
  <link rel="stylesheet" href="q10_mini_ui.css">
</head>
<body>
  <header>
    <h1>CodeFest 2026</h1>
    <p>Register for the annual developer meetup</p>
  </header>

  <main>
    <section class="card">
      <div class="card-image">
        <img src="images/ocean.svg" alt="Illustration of ocean waves">
      </div>

      <div class="card-content">
        <h2>Reserve your seat</h2>
        <form class="signup-form">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Jane Doe">

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="jane@example.com">

          <label for="track">Track</label>
          <select id="track">
            <option>Web Development</option>
            <option>Data Science</option>
            <option>Cloud &amp; DevOps</option>
          </select>

          <div class="form-actions">
            <button type="reset" class="btn btn-secondary">Clear</button>
            <button type="submit" class="btn btn-primary">Register</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer><p>&copy; 2026 CodeFest · Contact: hello@codefest.example</p></footer>
</body>
</html>
