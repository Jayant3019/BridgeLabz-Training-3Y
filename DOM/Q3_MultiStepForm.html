<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>
    <link rel="stylesheet" href="styles.css">
    <script src="Q3_MultiStepForm.js" defer></script>
</head>
<body>
<main>
    <h1>Assignment 7 – DOM</h1>
    
<h2>3-Step Registration Form</h2>
<form id="multiStepForm" novalidate>
  <section class="step active" data-step="0">
    <label>Name: <input id="name" type="text" autocomplete="name"></label>
    <p class="error" id="nameError"></p>
  </section>
  <section class="step" data-step="1">
    <label>Email: <input id="email" type="email" autocomplete="email"></label>
    <p class="error" id="emailError"></p>
  </section>
  <section class="step" data-step="2">
    <label>Password: <input id="password" type="password" autocomplete="new-password"></label>
    <p class="error" id="passwordError"></p>
  </section>
  <button type="button" id="backButton">Back</button>
  <button type="button" id="nextButton">Next</button>
</form>
<div id="summary" hidden></div>
</main>
</body>
</html>
