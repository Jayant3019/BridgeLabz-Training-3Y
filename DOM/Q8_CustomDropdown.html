<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dropdown</title>
    <link rel="stylesheet" href="styles.css">
    <script src="Q8_CustomDropdown.js" defer></script>
</head>
<body>
<main>
    <h1>Assignment 7 – DOM</h1>
    
<h2>Custom Dropdown</h2>
<div class="dropdown" id="customDropdown">
  <button type="button" id="dropdownButton" aria-expanded="false">Choose a department</button>
  <div id="dropdownOptions">
    <button class="dropdown-option" type="button">Computer Science</button>
    <button class="dropdown-option" type="button">Electronics</button>
    <button class="dropdown-option" type="button">Mechanical</button>
    <button class="dropdown-option" type="button">Civil</button>
  </div>
</div>
</main>
</body>
</html>
