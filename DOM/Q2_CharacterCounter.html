<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Character Counter</title>
    <link rel="stylesheet" href="styles.css">
    <script src="Q2_CharacterCounter.js" defer></script>
</head>
<body>
<main>
    <h1>Assignment 7 – DOM</h1>
    
<h2>Live Character Counter</h2>
<textarea id="message" rows="6" cols="50" maxlength="100" placeholder="Write up to 100 characters..."></textarea>
<p>Remaining characters: <strong id="counter" class="counter-normal">100</strong></p>
<button id="resetButton">Reset</button>
</main>
</body>
</html>
