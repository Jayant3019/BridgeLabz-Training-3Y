<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Validation</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; box-sizing: border-box; padding: 9px; }
        .error { color: red; }
        .success { color: green; }
        button { margin-top: 16px; padding: 9px 14px; }
    </style>
</head>
<body>
    <h1>Login Form Validation</h1>
    <form id="loginForm" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username">
        <div class="error" id="usernameError"></div>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password">
        <div class="error" id="passwordError"></div>

        <button type="submit">Login</button>
    </form>
    <p id="loginResult" aria-live="polite"></p>
    <script src="Q7_LoginValidation.js"></script>
</body>
</html>
