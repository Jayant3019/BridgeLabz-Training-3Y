<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Object Updater</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; box-sizing: border-box; padding: 9px; }
        button { margin-top: 16px; padding: 9px 14px; }
        pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Dynamic Object Updater</h1>
    <form id="userForm">
        <label for="userName">Name</label>
        <input id="userName" name="name" value="John" required>
        <label for="userEmail">Email</label>
        <input id="userEmail" name="email" type="email" value="john@mail.com" required>
        <label for="userAge">Age</label>
        <input id="userAge" name="age" type="number" min="1" value="21" required>
        <button type="submit">Update User</button>
    </form>
    <h2>Updated User Object</h2>
    <pre id="userOutput"></pre>
    <script src="Q8_DynamicObjectUpdater.js"></script>
</body>
</html>
