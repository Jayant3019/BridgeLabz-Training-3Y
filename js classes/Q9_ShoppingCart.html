<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart and Coupon</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; box-sizing: border-box; padding: 9px; }
        button { margin-top: 16px; padding: 9px 14px; }
        #cartOutput { background: #f4f4f4; padding: 12px; margin-top: 18px; }
        #message { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Shopping Cart</h1>
    <p>Sample cart: Wireless Mouse (₹800 × 1), Keyboard (₹1500 × 2).</p>
    <form id="couponForm">
        <label for="coupon">Coupon code (e.g. SAVE20 or DISC10)</label>
        <input id="coupon" placeholder="SAVE20">
        <button type="submit">Apply Coupon</button>
    </form>
    <div id="message" aria-live="polite"></div>
    <pre id="cartOutput"></pre>
    <script src="Q9_ShoppingCart.js"></script>
</body>
</html>
