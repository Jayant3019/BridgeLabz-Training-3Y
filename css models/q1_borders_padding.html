<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Borders and Padding</title>
  <link rel="stylesheet" href="q1_borders_padding.css">
</head>
<body>
  <header>
    <h1>Borders &amp; Padding</h1>
    <p>Hover over a box to change its border color.</p>
  </header>

  <main>
    <section class="row" aria-label="Border styles">
      <h2>Border styles</h2>
      <div class="boxes">
        <div class="box b-solid">solid</div>
        <div class="box b-dashed">dashed</div>
        <div class="box b-double">double</div>
        <div class="box b-groove">groove</div>
      </div>
    </section>

    <section class="row" aria-label="Rounded corners">
      <h2>Rounded corners (border-radius)</h2>
      <div class="boxes">
        <div class="box r-small">8px</div>
        <div class="box r-large">24px</div>
        <div class="box r-pill">pill</div>
        <div class="box r-circle">50%</div>
      </div>
    </section>

    <section class="row" aria-label="Padding values">
      <h2>Padding (internal spacing)</h2>
      <div class="boxes">
        <div class="box p-small">padding: 5px</div>
        <div class="box p-medium">padding: 20px</div>
        <div class="box p-large">padding: 40px</div>
        <div class="box p-mixed">10px 40px</div>
      </div>
    </section>
  </main>

  <footer><p>&copy; 2026 CSS Practice</p></footer>
</body>
</html>
