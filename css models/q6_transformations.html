<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Transformations</title>
  <link rel="stylesheet" href="q6_transformations.css">
</head>
<body>
  <header>
    <h1>CSS Transformations</h1>
    <p>Hover over each box.</p>
  </header>

  <main>
    <section class="showcase">
      <figure>
        <div class="box rotate">Rotate</div>
        <figcaption><code>rotate(45deg)</code> turns the box clockwise.</figcaption>
      </figure>
      <figure>
        <div class="box scale">Scale</div>
        <figcaption><code>scale(1.4)</code> enlarges the box.</figcaption>
      </figure>
      <figure>
        <div class="box translate">Translate</div>
        <figcaption><code>translate(30px, -20px)</code> moves the box.</figcaption>
      </figure>
      <figure>
        <div class="box skew">Skew</div>
        <figcaption><code>skew(20deg, 10deg)</code> slants the box.</figcaption>
      </figure>
    </section>
  </main>

  <footer><p>&copy; 2026 CSS Practice</p></footer>
</body>
</html>
