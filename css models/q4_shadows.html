<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadows and Depth</title>
  <link rel="stylesheet" href="q4_shadows.css">
</head>
<body>
  <header>
    <h1>Shadows &amp; Depth</h1>
    <p>Hover over a card to lift it.</p>
  </header>

  <main>
    <section class="cards">
      <article class="card soft">
        <h2>Anna Clarke</h2>
        <p class="role">UI Designer</p>
        <p>Soft, wide shadow for a gentle floating look.</p>
      </article>

      <article class="card sharp">
        <h2>Ravi Mehta</h2>
        <p class="role">Front-End Developer</p>
        <p>Offset hard shadow gives a bold, retro feel.</p>
      </article>

      <article class="card glow">
        <h2>Lina Park</h2>
        <p class="role">Product Manager</p>
        <p>Colored glow shadow adds a modern highlight.</p>
      </article>
    </section>
  </main>

  <footer><p>&copy; 2026 CSS Practice</p></footer>
</body>
</html>
