<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Q1 Responsive Image Filter Gallery.css">
</head>
<body>
<header><h1>Image Filter Gallery</h1></header>
<main class="gallery">
    <figure><img class="blur" src="https://picsum.photos/400/300?random=1" alt="Gallery image 1"><figcaption>Blur</figcaption></figure>
    <figure><img class="gray" src="https://picsum.photos/400/300?random=2" alt="Gallery image 2"><figcaption>Grayscale</figcaption></figure>
    <figure><img class="sepia" src="https://picsum.photos/400/300?random=3" alt="Gallery image 3"><figcaption>Sepia</figcaption></figure>
    <figure><img class="bright" src="https://picsum.photos/400/300?random=4" alt="Gallery image 4"><figcaption>Brightness</figcaption></figure>
    <figure><img class="contrast" src="https://picsum.photos/400/300?random=5" alt="Gallery image 5"><figcaption>Contrast</figcaption></figure>
    <figure><img class="hue" src="https://picsum.photos/400/300?random=6" alt="Gallery image 6"><figcaption>Hue Rotate</figcaption></figure>
</main>
</body>
</html>
